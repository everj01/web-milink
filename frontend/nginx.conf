server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API y redirecciones hacia el gateway
    location /api/ {
        proxy_pass http://api-gateway:8080;
    }
    location /r/ {
        proxy_pass http://api-gateway:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
