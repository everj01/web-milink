server:
  port: 8082

spring:
  application:
    name: servicio-estadisticas
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bd_estadisticas
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
